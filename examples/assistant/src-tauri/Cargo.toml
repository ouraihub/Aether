[package]
name = "example-assistant"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Independent adapters: `--no-default-features --features conversations` manages history
# without a model engine; `skills` and `mcp-client` alone expose only their settings.
# `aether` adds runs/providers; combine `aether,conversations` for persisted chat.
[features]
default = ["aether", "conversations", "skills", "mcp-client"]
aether = ["dep:aether-providers", "dep:aether-runtime", "aether-runtime/runs", "dep:async-trait", "dep:serde_json", "tauri-plugin-aether/providers", "tauri-plugin-aether/chat"]
conversations = ["dep:aether-runtime", "aether-runtime/conversations", "tauri-plugin-aether/conversations"]
skills = ["dep:aether-skills", "tauri-plugin-aether/skills", "aether-runtime?/skills"]
mcp-client = ["dep:aether-mcp-client", "tauri-plugin-aether/mcp-client", "aether-runtime?/mcp-client"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
async-trait = { workspace = true, optional = true }
aether-observability.workspace = true
aether-providers = { workspace = true, optional = true }
aether-runtime = { workspace = true, optional = true }
aether-skills = { workspace = true, optional = true }
aether-mcp-client = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tauri.workspace = true
tauri-plugin-aether.workspace = true
tracing.workspace = true

[lints]
workspace = true
