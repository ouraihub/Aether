name: macOS and Linux

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC: 18:00 UTC = 02:00 Asia/Shanghai the next day.
    - cron: '0 18 * * *'

concurrency:
  group: unix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Native stores and the full quality gate run on both shipping Unix targets.
  macos-core:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: >
          cargo check -p aether-support -p aether-observability -p aether-providers -p aether-chat
          -p aether-skills -p aether-mcp-client -p aether-mcp-server -p example-cli
      - name: Create unlocked native test keychain
        run: |
          security default-keychain -d user > "$RUNNER_TEMP/aether-original-keychain"
          security create-keychain -p aether-ci "$RUNNER_TEMP/aether-ci.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/aether-ci.keychain-db"
          security unlock-keychain -p aether-ci "$RUNNER_TEMP/aether-ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/aether-ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/aether-ci.keychain-db"
          # Workspace tests are different executables: pre-authorize only this disposable test key.
          account=$(printf '%s' "$(cd "$HOME" && pwd -P)" | shasum -a 256 | cut -d' ' -f1)
          key=$(openssl rand -hex 32)
          security add-generic-password -a "$account" -s com.ouraihub.aether.credentials.v1 \
            -X "$key" -A "$RUNNER_TEMP/aether-ci.keychain-db"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Remove native test keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/aether-original-keychain" ]; then
            original=$(tr -d '"' < "$RUNNER_TEMP/aether-original-keychain" | xargs)
            security default-keychain -d user -s "$original"
            security list-keychains -d user -s "$original"
          fi
          security delete-keychain "$RUNNER_TEMP/aether-ci.keychain-db"

  linux-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install native desktop and Secret Service dependencies
        timeout-minutes: 8
        run: |
          # The regional Azure mirror can sustain only tens of KB/s for WebKit.
          sudo "$(command -v node)" --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync } from 'node:fs';
          const files = ['/etc/apt/sources.list', ...readdirSync('/etc/apt/sources.list.d').filter(name => /\.(list|sources)$/.test(name)).map(name => `/etc/apt/sources.list.d/${name}`)];
          for (const file of files) {
            const source = readFileSync(file, 'utf8');
            const updated = source.replaceAll('azure.archive.ubuntu.com', 'archive.ubuntu.com');
            if (updated !== source) writeFileSync(file, updated);
          }
          NODE
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update --error-on=any
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential curl wget file libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev patchelf \
            libdbus-1-dev gnome-keyring dbus-x11 xvfb xauth
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: pnpm install --frozen-lockfile
      - name: Full gate in unlocked native Secret Service session
        run: |
          dbus-run-session -- xvfb-run -a bash -euc '
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            eval "$(printf "%s" aether-ci | gnome-keyring-daemon --unlock --components=secrets)"
            pnpm run ci
          '
