name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Enforce runner compiler ownership
        shell: cmd
        run: call scripts\msvc-env.bat
      # Every check lives in scripts/ci.mjs; locally run the same `pnpm run ci` before pushing.
      - run: pnpm run ci

  # Decision D3: Windows first, macOS later. Keep the core crates compiling on macOS
  # from day one so platform-specific code stays behind cfg gates.
  macos-core:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check -p aether-support -p aether-observability -p aether-providers -p aether-chat
          -p aether-skills -p aether-mcp-client -p aether-mcp-server -p example-cli
