name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Enforce runner compiler ownership
        shell: cmd
        run: call scripts\msvc-env.bat
      - run: pnpm run check
      - name: Crate dependency rules (docs/00 §3)
      - run: pnpm run kit:check-deps
      - run: pnpm run kit:dto-check
      - run: pnpm run kit:i18n
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Each plugin feature builds on its own
        shell: bash
        run: |
          for f in providers chat skills mcp-client mcp-server; do
            cargo check -p tauri-plugin-aether --no-default-features --features "$f"
          done

  # Decision D3: Windows first, macOS later. Keep the core crates compiling on macOS
  # from day one so platform-specific code stays behind cfg gates.
  macos-core:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check -p aether-support -p aether-observability -p aether-providers -p aether-chat
          -p aether-skills -p aether-mcp-client -p aether-mcp-server -p example-cli
