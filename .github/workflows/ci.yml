name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: classify
        run: node scripts/ci-scope.mjs

  light:
    needs: scope
    if: needs.scope.outputs.scope != 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci.mjs --scope "$CI_SCOPE"
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: pnpm install --frozen-lockfile
      - name: Enforce runner compiler ownership
        shell: cmd
        run: call node_modules\@ouraihub\desktop-kit\msvc\msvc-env.bat
      # Every check lives in scripts/ci.mjs; locally run the same `pnpm run ci` before pushing.
      - run: pnpm run ci

  ci:
    name: CI gate
    needs: [scope, light, windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify every selected check succeeded
        run: node scripts/ci-gate.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
