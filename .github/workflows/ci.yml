name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve successful checks for the exact tested tree
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse.mjs resolve

  reused-ci:
    needs: reuse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.reuse.outputs.reuse == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the actual merged commit and repository rules
        run: pnpm exec release-kit check
      - run: echo "The exact merged tree already passed all three native jobs; commit-dependent checks ran here. See the reuse job summary for provenance."

  build-windows:
    needs: reuse
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.reuse.outputs.reuse != 'true') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: pnpm install --frozen-lockfile
      - name: Enforce runner compiler ownership
        shell: cmd
        run: call node_modules\@ouraihub\desktop-kit\msvc\msvc-env.bat
      # Every check lives in scripts/ci.mjs; locally run the same `pnpm run ci` before pushing.
      - run: pnpm run ci
      - name: Record tested tree
        run: node scripts/ci-reuse.mjs record windows
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-receipt-windows-${{ github.run_attempt }}
          path: .ci-receipt/windows.json
          if-no-files-found: error
          retention-days: 14

  # Native stores and the full quality gate run on both shipping Unix targets.
  build-macos:
    needs: reuse
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.reuse.outputs.reuse != 'true') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check -p aether-support -p aether-observability -p aether-providers -p aether-chat
          -p aether-skills -p aether-mcp-client -p aether-mcp-server -p example-cli
      - name: Create unlocked native test keychain
        run: |
          security default-keychain -d user > "$RUNNER_TEMP/aether-original-keychain"
          security create-keychain -p aether-ci "$RUNNER_TEMP/aether-ci.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/aether-ci.keychain-db"
          security unlock-keychain -p aether-ci "$RUNNER_TEMP/aether-ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/aether-ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/aether-ci.keychain-db"
          # Workspace tests are different executables: pre-authorize only this disposable test key.
          account=$(printf '%s' "$(cd "$HOME" && pwd -P)" | shasum -a 256 | cut -d' ' -f1)
          key=$(openssl rand -hex 32)
          security add-generic-password -a "$account" -s com.ouraihub.aether.credentials.v1 \
            -X "$key" -A "$RUNNER_TEMP/aether-ci.keychain-db"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Remove native test keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/aether-original-keychain" ]; then
            original=$(tr -d '"' < "$RUNNER_TEMP/aether-original-keychain" | xargs)
            security default-keychain -d user -s "$original"
            security list-keychains -d user -s "$original"
          fi
          security delete-keychain "$RUNNER_TEMP/aether-ci.keychain-db"
      - name: Record tested tree
        run: node scripts/ci-reuse.mjs record macos-core
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-receipt-macos-core-${{ github.run_attempt }}
          path: .ci-receipt/macos-core.json
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: reuse
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.reuse.outputs.reuse != 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install native desktop and Secret Service dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev patchelf \
            libdbus-1-dev gnome-keyring dbus-x11 xvfb
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Full gate in unlocked native Secret Service session
        run: |
          dbus-run-session -- xvfb-run -a bash -euc '
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            eval "$(printf "%s" aether-ci | gnome-keyring-daemon --unlock --components=secrets)"
            pnpm run ci
          '
      - name: Record tested tree
        run: node scripts/ci-reuse.mjs record linux-core
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-receipt-linux-core-${{ github.run_attempt }}
          path: .ci-receipt/linux-core.json
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [reuse, reused-ci, build-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require native build or verified reuse and merged-commit checks
        env:
          REUSE: ${{ needs.reuse.outputs.reuse }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          MERGE_RESULT: ${{ needs.reused-ci.result }}
          BUILD_RESULT: ${{ needs.build-windows.result }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$REUSE" = true ]; then
            test "$REUSE_RESULT" = success && test "$MERGE_RESULT" = success
          else
            test "$BUILD_RESULT" = success
          fi

  macos-core:
    needs: [reuse, reused-ci, build-macos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require native build or verified reuse and merged-commit checks
        env:
          REUSE: ${{ needs.reuse.outputs.reuse }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          MERGE_RESULT: ${{ needs.reused-ci.result }}
          BUILD_RESULT: ${{ needs.build-macos.result }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$REUSE" = true ]; then
            test "$REUSE_RESULT" = success && test "$MERGE_RESULT" = success
          else
            test "$BUILD_RESULT" = success
          fi

  linux-core:
    needs: [reuse, reused-ci, build-linux]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require native build or verified reuse and merged-commit checks
        env:
          REUSE: ${{ needs.reuse.outputs.reuse }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          MERGE_RESULT: ${{ needs.reused-ci.result }}
          BUILD_RESULT: ${{ needs.build-linux.result }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$REUSE" = true ]; then
            test "$REUSE_RESULT" = success && test "$MERGE_RESULT" = success
          else
            test "$BUILD_RESULT" = success
          fi
