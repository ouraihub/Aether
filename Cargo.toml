[workspace]
members = [
  "crates/aether-support",
  "crates/aether-observability",
  "crates/aether-providers",
  "crates/aether-chat",
  "crates/aether-search",
  "crates/aether-mcp-client",
  "crates/aether-mcp-server",
  "plugin/tauri-plugin-aether",
  "examples/cli",
  "examples/assistant/src-tauri",
  "examples/providers-only/src-tauri",
  "examples/mcp-server-only/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Dependency baseline: docs/00-概要设计.md §6. Each crate opts in to what it uses;
# versions are pinned here and only upgraded in this repository.
[workspace.dependencies]
aether-support = { path = "crates/aether-support" }
aether-observability = { path = "crates/aether-observability" }
aether-providers = { path = "crates/aether-providers" }
aether-chat = { path = "crates/aether-chat" }
aether-skills = { path = "crates/aether-skills" }
aether-mcp-client = { path = "crates/aether-mcp-client" }
aether-mcp-server = { path = "crates/aether-mcp-server" }
aether-search = { path = "crates/aether-search" }
tauri-plugin-aether = { path = "plugin/tauri-plugin-aether" }

tauri = "=2.12.1"
tauri-build = "=2.7.1"
tauri-plugin = { version = "=2.7.1", features = ["build"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "=0.7.19"
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "process-group", "kill-on-drop", "creation-flags"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
rmcp = { version = "3.5.0", default-features = false }
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
zeroize = "=1.8.2"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
keyring = { version = "=3.6.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "=0.1.89"
getrandom = "0.4"
sha2 = "0.10"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
ts-rs = "11"
tempfile = "3"
url = "2.5.8"
# aether-mcp-server: serve rmcp's tower service over a loopback TcpListener (docs/13 §5).
hyper = { version = "^1.11.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
base64 = "=0.22.1"

# docs/04-工程规范.md §3.3、§7、§10。CI 以 `clippy -D warnings` 运行，warn 等同 deny。
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
await_holding_lock = "deny"
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_enum_match_arm = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
