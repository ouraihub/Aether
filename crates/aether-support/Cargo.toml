[package]
name = "aether-support"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["native"]
native = ["dep:reqwest", "dep:rusqlite", "dep:tokio", "dep:windows", "dep:aes-gcm", "dep:sha2", "dep:keyring"]

[dependencies]
getrandom.workspace = true
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"], optional = true }
tracing.workspace = true
url.workspace = true
ts-rs.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
aes-gcm = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
