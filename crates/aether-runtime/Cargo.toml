[package]
name = "aether-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
conversations = ["dep:aether-chat", "dep:aether-images", "aether-support/native", "dep:rusqlite", "dep:sha2"]
runs = ["conversations", "aether-chat/native", "dep:aether-providers", "aether-images/client", "dep:tokio", "dep:tokio-util", "dep:async-trait"]
# Authoring workspaces (runs + skills) need temp roots and approved, tree-killed script processes.
skills = ["dep:aether-skills", "dep:process-wrap", "dep:tempfile", "tokio?/process", "tokio?/io-util", "tokio?/fs"]
search = ["dep:aether-search"]
mcp-client = ["dep:aether-mcp-client"]

[dependencies]
aether-support.workspace = true
aether-chat = { workspace = true, optional = true, default-features = false }
aether-images = { workspace = true, optional = true }
aether-providers = { workspace = true, optional = true }
aether-skills = { workspace = true, optional = true }
aether-search = { workspace = true, optional = true }
aether-mcp-client = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
async-trait = { workspace = true, optional = true }
process-wrap = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tracing.workspace = true

[dev-dependencies]
aether-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }

[[example]]
name = "contract-output"
required-features = ["runs"]

# Runs contracts/scenarios.json on the real RunService and prints the observations as JSON;
# `scripts/contracts-check.mjs` builds and runs it (docs/22 §9).
[[example]]
name = "scenario-output"
required-features = ["runs"]

[lints]
workspace = true
