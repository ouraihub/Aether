[package]
name = "tauri-plugin-aether"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Required by tauri-plugin's build step: the app's tauri-build finds our permissions through it.
links = "tauri-plugin-aether"

# docs/15-详细设计-接入层.md §1. All features off by default; the observability crate is always on.
[features]
default = []
providers = ["dep:aether-providers"]
search = ["dep:aether-search", "aether-runtime?/search"]
chat = ["dep:aether-runtime", "aether-runtime/runs"]
conversations = ["dep:aether-runtime", "aether-runtime/conversations"]
skills = ["dep:aether-skills", "dep:rfd", "aether-runtime?/skills"]
mcp-client = ["dep:aether-mcp-client", "aether-runtime?/mcp-client"]
mcp-server = ["dep:aether-mcp-server"]

[dependencies]
tauri.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
aether-support.workspace = true
aether-observability.workspace = true
aether-providers = { workspace = true, optional = true }
aether-runtime = { workspace = true, optional = true }
aether-skills = { workspace = true, optional = true }
aether-mcp-client = { workspace = true, optional = true }
aether-search = { workspace = true, optional = true }
aether-mcp-server = { workspace = true, optional = true }
rfd = { version = "=0.17.2", optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
aether-providers.workspace = true
tokio.workspace = true

[build-dependencies]
tauri-plugin.workspace = true

[lints]
workspace = true
